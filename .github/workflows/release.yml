name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build_time: ${{ steps.meta.outputs.build_time }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          echo "version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"

  build-cli:
    needs: metadata
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, linux, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build standalone CLI
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_TIME: ${{ needs.metadata.outputs.build_time }}
        run: |
          set -euo pipefail
          mkdir -p package dist
          binary=maiku
          if [ "$GOOS" = windows ]; then binary=maiku.exe; fi
          go build -trimpath -ldflags="-s -w -X github.com/cappuch/maiku/updater.Version=$RELEASE_VERSION -X github.com/cappuch/maiku/updater.BuildTime=$RELEASE_TIME -X github.com/cappuch/maiku/updater.Repository=$GITHUB_REPOSITORY" -o "package/$binary" ./cmd/maiku

      - name: Smoke test CLI
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          ./package/maiku --version
          ./package/maiku --help

      - name: Package CLI
        env:
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          asset="maiku-cli-$TARGET_OS-$TARGET_ARCH"
          if [ "$TARGET_OS" = windows ]; then
            (cd package && zip "../dist/$asset.zip" maiku.exe)
          else
            tar -C package -czf "dist/$asset.tar.gz" maiku
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: maiku-cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  build-desktop:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build_args: -clean -platform darwin/universal
            test_args: ""
            asset_name: maiku-desktop-macos
            asset_kind: app
          - os: windows-latest
            build_args: -clean -platform windows/amd64
            test_args: ""
            asset_name: maiku-desktop-windows-amd64
            asset_kind: exe
          - os: ubuntu-latest
            build_args: -clean -platform linux/amd64 -tags webkit2_41
            test_args: -tags webkit2_41
            asset_name: maiku-desktop-linux-amd64
            asset_kind: bin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Test core
        run: go test ./...

      - name: Use upstream Wails module
        working-directory: desktop
        # Keep the complete edit flag as one argument under PowerShell.
        run: go mod edit '-dropreplace=github.com/wailsapp/wails/v2'

      - name: Tidy desktop module
        working-directory: desktop
        run: go mod tidy

      # main.go embeds frontend/dist, which Wails generates during the build.
      - name: Build desktop UI
        working-directory: desktop
        shell: bash
        env:
          CGO_ENABLED: "1"
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_TIME: ${{ needs.metadata.outputs.build_time }}
        run: |
          set -euo pipefail
          # Windows runners compile with MinGW. Without these flags the exe
          # imports libstdc++-6.dll (and the rest of the MinGW runtime), which
          # is not installed on a normal Windows machine.
          if [ "${RUNNER_OS}" = "Windows" ]; then
            export CGO_LDFLAGS="-static-libgcc -static-libstdc++ -Wl,-Bstatic -lstdc++ -lpthread -Wl,-Bdynamic"
          fi
          wails build ${{ matrix.build_args }} -ldflags "-X github.com/cappuch/maiku/updater.Version=$RELEASE_VERSION -X github.com/cappuch/maiku/updater.BuildTime=$RELEASE_TIME -X github.com/cappuch/maiku/updater.Repository=$GITHUB_REPOSITORY"

      - name: Test desktop backend
        working-directory: desktop
        env:
          CGO_ENABLED: "1"
        run: go test ${{ matrix.test_args }} ./...

      - name: Package macOS artifact
        if: matrix.asset_kind == 'app'
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent desktop/build/bin/maiku.app "dist/${{ matrix.asset_name }}.zip"

      - name: Package Windows artifact
        if: matrix.asset_kind == 'exe'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = "desktop/build/bin/maiku-desktop.exe"
          Copy-Item $exe "dist/${{ matrix.asset_name }}.exe"
          $objdump = Get-Command objdump -ErrorAction SilentlyContinue
          if (-not $objdump) { throw "objdump is required to verify the Windows exe has no MinGW DLL imports" }
          $deps = & objdump -p $exe
          $missing = @('libstdc++-6.dll', 'libgcc_s_seh-1.dll', 'libgcc_s_dw2-1.dll', 'libwinpthread-1.dll') | Where-Object { $deps -match [regex]::Escape($_) }
          if ($missing) { throw "Windows exe still imports MinGW runtime: $($missing -join ', ')" }

      - name: Package Linux artifact
        if: matrix.asset_kind == 'bin'
        run: |
          set -euo pipefail
          mkdir -p dist package
          install -m 0755 desktop/build/bin/maiku-desktop "package/${{ matrix.asset_name }}"
          tar -C package -czf "dist/${{ matrix.asset_name }}.tar.gz" "${{ matrix.asset_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [metadata, build-desktop, build-cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Update metadata
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_TIME: ${{ needs.metadata.outputs.build_time }}
        run: |
          python3 - <<'PY'
          import json, os
          with open("dist/updater.json", "w") as f:
              json.dump({"version": os.environ["RELEASE_VERSION"],
                         "buildTime": int(os.environ["RELEASE_TIME"])}, f)
          PY

      - name: Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          ls -lah

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.version }}
          name: maiku ${{ needs.metadata.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          draft: true
          body: '<!-- maiku-updater:{"version":"${{ needs.metadata.outputs.version }}","buildTime":${{ needs.metadata.outputs.build_time }}} -->'
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true

      # Publish only after every payload, checksum, and metadata file is uploaded.
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: gh release edit "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --draft=false
