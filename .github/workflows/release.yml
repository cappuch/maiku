name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build_args: -clean -platform darwin/universal
            test_args: ""
            asset_name: maiku-desktop-macos
            asset_kind: app
          - os: windows-latest
            build_args: -clean -platform windows/amd64
            test_args: ""
            asset_name: maiku-desktop-windows-amd64
            asset_kind: exe
          - os: ubuntu-latest
            build_args: -clean -platform linux/amd64 -tags webkit2_41
            test_args: -tags webkit2_41
            asset_name: maiku-desktop-linux-amd64
            asset_kind: bin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Test core
        run: go test ./...

      - name: Use upstream Wails module
        working-directory: desktop
        run: go mod edit -dropreplace=github.com/wailsapp/wails/v2

      - name: Tidy desktop module
        working-directory: desktop
        run: go mod tidy

      - name: Test desktop backend
        working-directory: desktop
        env:
          CGO_ENABLED: "1"
        run: go test ${{ matrix.test_args }} ./...

      - name: Build desktop UI
        working-directory: desktop
        env:
          CGO_ENABLED: "1"
        run: wails build ${{ matrix.build_args }}

      - name: Package macOS artifact
        if: matrix.asset_kind == 'app'
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent desktop/build/bin/maiku.app "dist/${{ matrix.asset_name }}.zip"

      - name: Package Windows artifact
        if: matrix.asset_kind == 'exe'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item desktop/build/bin/maiku-desktop.exe "dist/${{ matrix.asset_name }}.exe"

      - name: Package Linux artifact
        if: matrix.asset_kind == 'bin'
        run: |
          set -euo pipefail
          mkdir -p dist package
          install -m 0755 desktop/build/bin/maiku-desktop "package/${{ matrix.asset_name }}"
          tar -C package -czf "dist/${{ matrix.asset_name }}.tar.gz" "${{ matrix.asset_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Short SHA
        id: meta
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          ls -lah

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: sha-${{ steps.meta.outputs.short_sha }}
          name: maiku ${{ steps.meta.outputs.short_sha }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: dist/*
