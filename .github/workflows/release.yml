name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        id: build
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"

          mkdir -p dist
          targets=(
            "linux amd64"
            "linux arm64"
            "darwin amd64"
            "darwin arm64"
            "windows amd64"
            "windows arm64"
          )
          for target in "${targets[@]}"; do
            read -r goos goarch <<<"$target"
            ext=""
            if [[ "$goos" == "windows" ]]; then
              ext=".exe"
            fi
            out="dist/maiku-${goos}-${goarch}${ext}"
            echo "Building $out"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w" \
              -o "$out" ./cmd/maiku
          done
          (
            cd dist
            sha256sum maiku-* > checksums.txt
          )
          ls -lah dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sha-${{ steps.build.outputs.short_sha }}
          name: maiku ${{ steps.build.outputs.short_sha }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: |
            dist/maiku-*
            dist/checksums.txt
